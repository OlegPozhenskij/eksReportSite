<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PhoneRecord - Отправка аудио и отчёты</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="app-container">
    <!-- Левая панель: отправка -->
    <div class="left-panel">
        <div class="panel-header">
            <i class="fas fa-microphone-alt"></i>
            <h2>Отправка записи</h2>
        </div>

        <div class="form-group">
            <label for="phoneInput">
                <i class="fas fa-phone"></i> Номер телефона
            </label>
            <input type="tel" id="phoneInput" placeholder="+7 (XXX) XXX-XX-XX" value="79270000000">
            <small class="hint">Введите номер в любом формате (автоматически очистится)</small>
        </div>

        <div class="form-group">
            <label for="contactNameInput">
                <i class="fas fa-user"></i> Имя контакта (опционально)
            </label>
            <input type="text" id="contactNameInput" placeholder="Например: Иван Петров">
            <small class="hint">Будет отображаться в названии папки с отчётами</small>
        </div>

        <div class="form-group">
            <label for="fileInput">
                <i class="fas fa-file-audio"></i> Аудиофайл
            </label>
            <div class="file-drop-area" id="fileDropArea">
                <i class="fas fa-cloud-upload-alt"></i>
                <p>Нажмите для выбора или перетащите файл</p>
                <input type="file" id="fileInput" accept="audio/*,video/mp4,.aac,.mp3,.m4a,.amr,.3gp" style="display: none;">
                <div id="filePreview" class="file-preview"></div>
            </div>
        </div>

        <button id="uploadBtn" class="btn-primary">
            <i class="fas fa-paper-plane"></i> Отправить на сервер
        </button>

        <div id="statusMessage" class="status-message"></div>
    </div>

    <!-- Правая панель: отчёты -->
    <div class="right-panel">
        <div class="panel-header">
            <i class="fas fa-folder-open"></i>
            <h2>Отчёты с сервера</h2>
            <button id="refreshReportsBtn" class="btn-icon" title="Обновить">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>

        <div id="reportsContainer" class="reports-container">
            <div class="loading">Загрузка отчётов...</div>
        </div>
    </div>
</div>

<!-- Модальное окно для предпросмотра DOCX -->
<div id="previewModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-file-alt"></i> Предпросмотр документа</h3>
            <button class="modal-close" onclick="closePreview()">&times;</button>
        </div>
        <div class="modal-body">
            <iframe id="previewIframe" src="about:blank"></iframe>
        </div>
        <div class="modal-footer">
            <button id="downloadFromModalBtn" class="btn-secondary">📥 Скачать DOCX</button>
            <button onclick="closePreview()" class="btn-outline">Закрыть</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
